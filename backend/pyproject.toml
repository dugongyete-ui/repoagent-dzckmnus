[project]
name = "backend"
version = "0.1.0"
description = "Backend for AI Dzeck — general-purpose AI Agent platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # ── Core server ──────────────────────────────────────────────────────────
    "beanie>=1.25.0",
    "cryptography>=3.4.8",
    "debugpy>=1.8.17",
    "fastapi>=0.121.2",
    "httpx>=0.28.1",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "pyjwt[crypto]>=2.8.0",
    "pymongo>=4.14.0",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.20",
    "redis>=5.0.1",
    "sse-starlette>=3.0.3",
    "uvicorn>=0.38.0",
    "websockets>=15.0.1",
    # ── AI / LLM ─────────────────────────────────────────────────────────────
    "langchain>=1.0.7",
    "langchain-classic>=1.0.7",
    "langchain-openai>=1.0.3",
    "openai>=2.8.0",
    # ── Sandbox / browser / search ───────────────────────────────────────────
    "browser-use>=0.12.1",
    "playwright>=1.42.0",
    "psutil>=5.9.0",
    "tavily-python>=0.5.0",
    # ── Utilities ────────────────────────────────────────────────────────────
    "beautifulsoup4>=4.12.0",
    "curl-cffi>=0.14.0",
    "markdownify>=1.2.0",
    "mcp>=1.9.0",
    # ── File extraction (server-side, no sandbox needed) ─────────────────────
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "requests>=2.28.0",
]
